
name: Build Sakib's ICT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          set -e
          unzip -q -o SakibsICT_HTML_Practice_Android_Project.zip -d /tmp/sakib-project
          PROJECT_ROOT="$(find /tmp/sakib-project -name settings.gradle -type f -print -quit | xargs dirname)"
          test -n "$PROJECT_ROOT"
          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/
          test -d app

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakibs-ICT-HTML-Practice-APK
          path: app/build/outputs/apk/debug/*.apk
